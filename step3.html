<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FUTURE CAR CRAFT — ボディカラーを選択</title>
  <link rel="stylesheet" href="style.css" />
  <script src="phi-grid.js"></script>
</head>
<body class="page-scroll">

  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--left"></div>
  <div class="bg-glow bg-glow--right"></div>

  <main class="step-stage">
    <div class="step-header">
      <p class="step-eyebrow">STEP 3 / 05</p>
      <h1 class="step-title">ボディカラーを入力してください</h1>
      <p class="step-sub">車体の色を自由に文字で入力してください（2色以上を組み合わせるとマーブルなどの混ぜ方も選べます）</p>
    </div>

    <input
      type="text"
      id="colorPrompt"
      class="prompt-input"
      placeholder="例：レーシングレッド、赤 × 黒、ゴールド..."
      maxlength="80"
      autocomplete="off"
      aria-label="ボディカラー"
    />

    <div class="prompt-box">
      <p class="prompt-hint">思い描いているボディカラーを言葉で説明してください（候補は組み合わせて選べます）</p>
      <div class="car-preview car-preview--inline" id="carPreview">
        <div class="car-preview__glow" aria-hidden="true"></div>
      </div>
      <div class="suggestion-selected" id="selectedList" aria-label="選択中" hidden></div>
      <div class="suggestion-list" id="suggestionList" aria-label="候補"></div>

      <div class="mix-row" id="mixRow" hidden>
        <p class="mix-row__label">混ぜ方</p>
        <div class="suggestion-list" id="mixOptions">
          <button type="button" class="suggestion-chip mix-chip" data-mix="marble">マーブル</button>
          <button type="button" class="suggestion-chip mix-chip" data-mix="gradient">グラデーション</button>
          <button type="button" class="suggestion-chip mix-chip" data-mix="twotone">ツートン</button>
          <button type="button" class="suggestion-chip mix-chip" data-mix="stripe">ストライプ</button>
        </div>
      </div>

      <div class="ratio-row" id="ratioRow" hidden>
        <p class="ratio-row__label">比率（0〜10、0で完全に除外）</p>
        <div class="ratio-list" id="ratioList"></div>
      </div>

      <div class="mix-row" id="finishRow" hidden>
        <p class="mix-row__label">加工方法</p>
        <div class="suggestion-list" id="finishOptions">
          <button type="button" class="suggestion-chip finish-chip" data-finish="">指定なし</button>
          <button type="button" class="suggestion-chip finish-chip" data-finish="マット">マット</button>
          <button type="button" class="suggestion-chip finish-chip" data-finish="メタリック">メタリック</button>
          <button type="button" class="suggestion-chip finish-chip" data-finish="パール">パール</button>
          <button type="button" class="suggestion-chip finish-chip" data-finish="グロス（光沢）">グロス（光沢）</button>
          <button type="button" class="suggestion-chip finish-chip" data-finish="サテン">サテン</button>
          <button type="button" class="suggestion-chip finish-chip" data-finish="クローム">クローム</button>
        </div>
      </div>
    </div>

    <div class="step-actions">
      <a href="step2.html" class="btn-back"><span aria-hidden="true">←</span><span>BACK</span></a>
      <button type="button" class="btn-next" id="nextBtn" disabled>
        <span>NEXT</span>
        <span aria-hidden="true">→</span>
      </button>
    </div>
  </main>

  <footer class="footer">
    <span class="footer__dot"></span>
    <span class="footer__dot"></span>
    <span class="footer__dot footer__dot--active"></span>
    <span class="footer__dot"></span>
    <span class="footer__dot"></span>
  </footer>

  <script>
    const promptInput = document.getElementById('colorPrompt');
    const nextBtn = document.getElementById('nextBtn');
    const carPreview = document.getElementById('carPreview');
    const selectedList = document.getElementById('selectedList');
    const suggestionList = document.getElementById('suggestionList');
    const mixRow = document.getElementById('mixRow');
    const mixOptions = document.getElementById('mixOptions');
    const ratioRow = document.getElementById('ratioRow');
    const ratioList = document.getElementById('ratioList');
    const finishRow = document.getElementById('finishRow');
    const finishOptions = document.getElementById('finishOptions');

    // 基本の車体カラー候補のみを hex に対応させる。
    // 長い名前ほど優先して部分一致させる。
    const COLOR_NAME_MAP = {
      'レッド': '#ff0000',
      'ブルー': '#0000ff',
      'グリーン': '#00ff00',
      'オレンジ': '#ff8000',
      'イエロー': '#ffff00',
      'ホワイト': '#ffffff',
      'ブラック': '#000000',
      'シルバー': '#c0c0c0',
    };
    const COLOR_KEYS = Object.keys(COLOR_NAME_MAP).sort((a, b) => b.length - a.length);

    // 辞書に無い単語（英語名や #hex、rgb() など）はブラウザに色として解釈させて判定する。
    function resolveCssColor(text) {
      const probe = document.createElement('span');
      probe.style.color = '';
      probe.style.color = text;
      if (!probe.style.color) return null;
      document.body.appendChild(probe);
      const computed = getComputedStyle(probe).color;
      document.body.removeChild(probe);
      const nums = computed.match(/[\d.]+/g);
      if (!nums) return null;
      const [r, g, b] = nums.map((n) => Math.round(parseFloat(n)));
      return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
    }

    function resolveColorHex(word) {
      const trimmed = word.trim();
      if (!trimmed) return null;
      const key = COLOR_KEYS.find((k) => trimmed.includes(k));
      if (key) return COLOR_NAME_MAP[key];
      return resolveCssColor(trimmed);
    }

    // 基本の車体カラー候補。この順番のまま常時全て表示する（シャッフルなし）。
    const SUGGESTION_POOL = [
      'レッド', 'ブルー', 'グリーン', 'オレンジ',
      'イエロー', 'ホワイト', 'ブラック', 'シルバー',
    ];
    const COMBINE_SEPARATOR = ' × ';
    const DEFAULT_HEX = '#8892a6';

    let mixMode = 'marble';
    let finishType = '';
    let colorRatios = {};
    let currentPicks = [];
    let activeParent = null;

    function itemLabel(item) {
      return typeof item === 'string' ? item : item.label;
    }

    function itemChildren(item) {
      return typeof item === 'string' ? null : item.children;
    }

    function currentSelected() {
      return getParts().map(extractBase);
    }

    function pickNewSuggestions() {
      currentPicks = SUGGESTION_POOL;
    }

    // 選択済みの候補は、常に見えるように候補リストの上に固定表示する。
    function renderSelected() {
      const selected = currentSelected();
      selectedList.innerHTML = '';
      selectedList.hidden = selected.length === 0;
      selected.forEach((label) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'suggestion-chip is-active';
        chip.dataset.value = label;
        chip.textContent = label;
        selectedList.appendChild(chip);
      });
    }

    // 選択済みの候補は並び替えず、その場を空白の穴にして位置を保持する。
    // 子項目を持つ候補は、そこから2段階目の候補一覧に切り替えられる。
    function renderSuggestions() {
      const selected = currentSelected();
      const items = activeParent ? itemChildren(activeParent) : currentPicks;
      suggestionList.innerHTML = '';

      if (activeParent) {
        const backChip = document.createElement('button');
        backChip.type = 'button';
        backChip.className = 'suggestion-chip suggestion-chip--back';
        backChip.dataset.action = 'back';
        backChip.textContent = `← ${itemLabel(activeParent)}`;
        suggestionList.appendChild(backChip);
      }

      items.forEach((item) => {
        const label = itemLabel(item);
        const children = itemChildren(item);
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = selected.includes(label) ? 'suggestion-chip is-hole' : 'suggestion-chip';
        if (children) chip.classList.add('has-children');
        chip.dataset.value = label;
        chip.textContent = children ? `${label} ›` : label;
        suggestionList.appendChild(chip);
      });
    }

    function refreshSuggestionUI() {
      renderSelected();
      renderSuggestions();
    }

    function updateNextState() {
      nextBtn.disabled = promptInput.value.trim().length === 0;
    }

    function syncMixButtons() {
      Array.from(mixOptions.querySelectorAll('.mix-chip')).forEach((chip) => {
        chip.classList.toggle('is-active', chip.dataset.mix === mixMode);
      });
    }

    function syncFinishButtons() {
      Array.from(finishOptions.querySelectorAll('.finish-chip')).forEach((chip) => {
        chip.classList.toggle('is-active', chip.dataset.finish === finishType);
      });
    }

    function saveFinish() {
      try {
        localStorage.setItem('fcc:selectedColorFinish', finishType);
      } catch (e) {}
    }

    function getParts() {
      return promptInput.value
        .split(COMBINE_SEPARATOR)
        .map((s) => s.trim())
        .filter(Boolean);
    }

    // 「レーシングレッド(7)」のような表記から、名前部分と比率（末尾の括弧内の数字）を取り出す。
    const RATIO_SUFFIX = /^(.*?)\((\d{1,2})\)\s*$/;

    function extractBase(part) {
      const m = part.match(RATIO_SUFFIX);
      return m ? m[1].trim() : part.trim();
    }

    function extractRatio(part) {
      const m = part.match(RATIO_SUFFIX);
      return m ? Math.min(10, Math.max(0, Number(m[2]))) : null;
    }

    // 比率を「色名(数字)」の形でテキストに埋め込む。組み合わせが1件だけなら数字は付けない。
    function buildDisplayText(baseParts) {
      if (baseParts.length <= 1) return baseParts.join(COMBINE_SEPARATOR);
      return baseParts.map((p) => `${p}(${colorRatios[p] ?? 5})`).join(COMBINE_SEPARATOR);
    }

    function saveRatios() {
      try {
        localStorage.setItem('fcc:selectedColorRatios', JSON.stringify(colorRatios));
      } catch (e) {}
    }

    // 2色以上を組み合わせたときだけ、各色の比率（0〜10、0で完全に除外）をスライダーで調整できるようにする。
    function renderRatioRow(baseParts) {
      ratioRow.hidden = baseParts.length < 2;
      ratioList.innerHTML = '';
      if (baseParts.length < 2) return;
      baseParts.forEach((part) => {
        const item = document.createElement('div');
        item.className = 'ratio-item';

        const label = document.createElement('span');
        label.className = 'ratio-item__label';
        label.textContent = part;

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '0';
        slider.max = '10';
        slider.value = String(colorRatios[part] ?? 5);
        slider.className = 'ratio-item__slider';
        slider.setAttribute('aria-label', `${part} の比率`);

        const valueLabel = document.createElement('span');
        valueLabel.className = 'ratio-item__value';
        valueLabel.textContent = slider.value;

        // スライダーを動かすたびに、入力欄のテキストにも「色名(数字)」として反映する。
        slider.addEventListener('input', () => {
          colorRatios[part] = Number(slider.value);
          valueLabel.textContent = slider.value;
          saveRatios();
          promptInput.value = buildDisplayText(getParts().map(extractBase));
          refreshSuggestionUI();
          applyColorPreviewOnly();
        });

        item.append(label, slider, valueLabel);
        ratioList.appendChild(item);
      });
    }

    function syncRatios() {
      const rawParts = getParts();
      const baseParts = rawParts.map(extractBase);
      Object.keys(colorRatios).forEach((k) => {
        if (!baseParts.includes(k)) delete colorRatios[k];
      });
      rawParts.forEach((raw, i) => {
        const base = baseParts[i];
        const explicit = extractRatio(raw);
        if (explicit !== null) colorRatios[base] = explicit;
        else if (!(base in colorRatios)) colorRatios[base] = 5;
      });
      renderRatioRow(baseParts);
      saveRatios();
    }

    // テキストを色に解決しつつ、比率スライダーの値
    // （colorRatios、未設定なら5）も一緒に返す — プレビューの帯の太さを
    // 比率に合わせて変えるために必要。
    function getColorEntriesFromText(text) {
      return text
        .split(COMBINE_SEPARATOR)
        .map((s) => s.trim())
        .filter(Boolean)
        .map((raw) => {
          const hex = resolveColorHex(raw);
          if (!hex) return null;
          const ratio = colorRatios[extractBase(raw)] ?? extractRatio(raw) ?? 5;
          return { hex, ratio: Math.max(ratio, 0.001) };
        })
        .filter(Boolean);
    }

    // 選んだ「混ぜ方」ごとに見た目が変わるプレビュー背景を組み立てる。
    // 帯の太さは比率スライダーに比例させる（比率0の色はほぼ幅なしになる）。
    // car-preview__glow 側の blur(48px) が効くので、stripe/twotone の
    // 硬い境界も柔らかい馴染んだ見た目になる。
    function buildCarColorBackground(entries, mode) {
      if (entries.length === 0) return DEFAULT_HEX;
      if (entries.length === 1) return entries[0].hex;

      const total = entries.reduce((sum, e) => sum + e.ratio, 0);

      if (mode === 'twotone') {
        const stops = [];
        let pos = 0;
        entries.forEach(({ hex, ratio }) => {
          const next = pos + (ratio / total) * 100;
          stops.push(`${hex} ${pos}%`, `${hex} ${next}%`);
          pos = next;
        });
        return `linear-gradient(90deg, ${stops.join(', ')})`;
      }

      if (mode === 'stripe') {
        // 全体のストライプ周期を比率の合計と同じ比率で分割し、
        // 短い周期で繰り返すことで縞模様にする。
        const cycle = entries.reduce((sum, e) => sum + e.ratio, 0) * 6;
        const stops = [];
        let pos = 0;
        entries.forEach(({ hex, ratio }) => {
          const next = pos + (ratio / total) * cycle;
          stops.push(`${hex} ${pos}%`, `${hex} ${next}%`);
          pos = next;
        });
        return `repeating-linear-gradient(45deg, ${stops.join(', ')})`;
      }

      if (mode === 'marble') {
        // 色ごとに角度を比率配分した conic-gradient を、渦を感じさせる
        // 開始角度・中心位置とともに使う。blur と組み合わさって
        // マーブル状のにじみに見える。
        const stops = [];
        let angle = 0;
        entries.forEach(({ hex, ratio }) => {
          const next = angle + (ratio / total) * 360;
          stops.push(`${hex} ${angle}deg`, `${hex} ${next}deg`);
          angle = next;
        });
        return `conic-gradient(from 45deg at 35% 40%, ${stops.join(', ')})`;
      }

      // gradient（デフォルト）: 比率に応じた位置で滑らかに繋ぐ。
      const stops = [];
      let pos = 0;
      entries.forEach(({ hex, ratio }, i) => {
        stops.push(`${hex} ${pos}%`);
        pos += (ratio / total) * 100;
        if (i === entries.length - 1) stops.push(`${hex} 100%`);
      });
      return `linear-gradient(90deg, ${stops.join(', ')})`;
    }

    // 比率スライダーのドラッグ中は syncRatios/renderRatioRow を呼び直さない
    // （スライダーDOMが再生成されドラッグが途切れてしまうため）。プレビューと
    // 保存だけを行う軽量版。
    function applyColorPreviewOnly() {
      const value = promptInput.value.trim();
      const entries = getColorEntriesFromText(value);
      const colors = entries.map((e) => e.hex);
      mixRow.hidden = colors.length < 2;
      syncMixButtons();

      finishRow.hidden = colors.length < 1;
      syncFinishButtons();

      const mode = colors.length >= 2 ? mixMode : 'solid';
      carPreview.style.setProperty(
        '--car-color',
        entries.length ? buildCarColorBackground(entries, mode) : 'transparent'
      );

      try {
        localStorage.setItem('fcc:selectedColor', value);
        localStorage.setItem('fcc:selectedColorHexes', JSON.stringify(colors));
        localStorage.setItem('fcc:selectedColorMix', mode);
      } catch (e) {}
    }

    function applyColors() {
      syncRatios();
      applyColorPreviewOnly();
    }

    promptInput.addEventListener('input', () => {
      updateNextState();
      refreshSuggestionUI();
      applyColors();
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !nextBtn.disabled) {
        nextBtn.click();
      }
    });

    suggestionList.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="back"]')) {
        activeParent = null;
        renderSuggestions();
        return;
      }

      const chip = e.target.closest('.suggestion-chip');
      if (!chip || chip.classList.contains('is-hole')) return;

      const baseParts = getParts().map(extractBase);
      const idx = baseParts.indexOf(chip.dataset.value);
      if (idx >= 0) {
        baseParts.splice(idx, 1);
        delete colorRatios[chip.dataset.value];
      } else {
        baseParts.push(chip.dataset.value);
        if (!(chip.dataset.value in colorRatios)) colorRatios[chip.dataset.value] = 5;
        // 子項目を選んだら、より大まかな親カテゴリは選択から外す。
        if (activeParent && itemLabel(activeParent) !== chip.dataset.value) {
          const parentIdx = baseParts.indexOf(itemLabel(activeParent));
          if (parentIdx >= 0) {
            baseParts.splice(parentIdx, 1);
            delete colorRatios[itemLabel(activeParent)];
          }
        }
      }
      promptInput.value = buildDisplayText(baseParts);
      promptInput.dispatchEvent(new Event('input'));

      if (chip.classList.contains('has-children')) {
        const items = activeParent ? itemChildren(activeParent) : currentPicks;
        activeParent = items.find((it) => itemLabel(it) === chip.dataset.value) || null;
        renderSuggestions();
      }
    });

    mixOptions.addEventListener('click', (e) => {
      const chip = e.target.closest('.mix-chip');
      if (!chip) return;
      mixMode = chip.dataset.mix;
      applyColors();
    });

    finishOptions.addEventListener('click', (e) => {
      const chip = e.target.closest('.finish-chip');
      if (!chip) return;
      finishType = chip.dataset.finish;
      saveFinish();
      syncFinishButtons();
    });

    // 選択済みチップをクリックすると解除する（候補リストの上に常時表示される分）。
    selectedList.addEventListener('click', (e) => {
      const chip = e.target.closest('.suggestion-chip');
      if (!chip) return;
      const baseParts = getParts().map(extractBase);
      const idx = baseParts.indexOf(chip.dataset.value);
      if (idx >= 0) {
        baseParts.splice(idx, 1);
        delete colorRatios[chip.dataset.value];
      }
      promptInput.value = buildDisplayText(baseParts);
      promptInput.dispatchEvent(new Event('input'));
    });

    try {
      const saved = localStorage.getItem('fcc:selectedColor');
      const savedMix = localStorage.getItem('fcc:selectedColorMix');
      const savedFinish = localStorage.getItem('fcc:selectedColorFinish');
      const savedRatios = JSON.parse(localStorage.getItem('fcc:selectedColorRatios') || '{}');
      colorRatios = savedRatios || {};
      if (savedMix) mixMode = savedMix;
      if (savedFinish) finishType = savedFinish;
      if (saved) {
        promptInput.value = saved;
        updateNextState();
      }
      applyColors();
    } catch (e) {}

    pickNewSuggestions();
    refreshSuggestionUI();

    nextBtn.addEventListener('click', () => {
      const value = promptInput.value.trim();
      if (!value) return;
      window.location.href = 'step4.html';
    });
  </script>

</body>
</html>
